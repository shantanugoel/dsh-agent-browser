# The dsh-agent-browser bundle patch. Applied as ONE insert over the profile
# root when the package is installed via `dsh plugin --profile <name> add
# dsh-agent-browser`; the reconciler appends this package to dsh.profile.bundles.
#
# Config overrides belong in the user's cordis.patch.yml (last write wins per
# row id), e.g.:
#   - id: browser
#     config:
#       defaultTimeoutMs: 90000

- insert:
    - id: browser
      name: dsh-agent-browser
      config:
        autoOpenPanel: true
        idleTimeoutMinutes: 15
        # Base RPC budget in ms; per-op budgets scale from it (nav 1.5x,
        # snapshot/shot 1x, act 3x, read 0.75x, eval 0.5x).
        defaultTimeoutMs: 60000
        cookiesRedacted: true
